[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-agent"
version = "0.1.0"
description = "Agente RAG auditable compatible con Open Responses 2026-04-24"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "boto3>=1.35",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "httpx>=0.27", "anyio>=4.4", "pyyaml>=6.0"]

[project.scripts]
# Menú interactivo. Tras `pip install -e .` basta con escribir `rag`.
rag = "rag_agent.infrastructure.inbound.cli.menu:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "contract: casos A y B del contrato (§9)",
    "rag: casos C — recuperación y veracidad",
    "operation: casos D — operación",
    "requires_bedrock: exige un modelo real; se salta con adaptadores locales",
    "requires_kb: exige recuperación semántica (Bedrock KB); el matcher local es léxico",
    "slow: tarda más de un segundo (concurrencia, streaming real)",
    "deployed: corre contra el despliegue; exige BASE_URL",
]
filterwarnings = ["error::DeprecationWarning:rag_agent.*"]
