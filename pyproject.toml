[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-agent"
version = "0.1.0"
description = "Agente RAG auditable compatible con Open Responses 2026-04-24"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "boto3>=1.35",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Dependencias de la preparación del corpus. No viajan en la imagen: el servicio
# nunca lee un PDF, solo el índice ya construido.
#   pypdf[crypto] descifra los PDF con contraseña de propietario vacía
#   pypdfium2     rasteriza para el OCR (BSD/Apache; PyMuPDF es AGPL)
ingest = ["pypdf[crypto]>=6.0", "pypdfium2>=4.30", "pillow>=10.0"]
# Banco de pruebas de extracción (scripts/lab/). Arrastra torch y los modelos de
# layout y de tabla, que se descargan en la primera conversión: fuera de `dev` a
# propósito, para que instalar el proyecto no cueste dos gigas. Se está midiendo
# contra pypdf+Textract; si gana, esto deja de ser un extra opcional.
docling = ["docling>=2.0"]
dev = [
    "pytest>=8.3", "pytest-asyncio>=0.24", "httpx>=0.27", "anyio>=4.4", "pyyaml>=6.0",
    "rag-agent[ingest]",
]

[project.scripts]
# Menú interactivo. Tras `pip install -e .` basta con escribir `rag`.
rag = "rag_agent.infrastructure.inbound.cli.menu:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "contract: casos A y B del contrato (§9)",
    "rag: casos C — recuperación y veracidad",
    "operation: casos D — operación",
    "requires_bedrock: exige un modelo real; se salta con adaptadores locales",
    "requires_kb: exige recuperación semántica (Bedrock KB); el matcher local es léxico",
    "slow: tarda más de un segundo (concurrencia, streaming real)",
    "deployed: corre contra el despliegue; exige BASE_URL",
]
filterwarnings = ["error::DeprecationWarning:rag_agent.*"]
